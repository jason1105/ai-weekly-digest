name: Generate Weekly AI Digest

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 09:00 UTC
  workflow_dispatch:      # Allow manual triggering from GitHub UI

permissions:
  issues: write   # 失败告警需要开 issue
  contents: write
  pull-requests: write

jobs:
  generate-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch data and generate digest
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          # 过渡期保留 OpenRouter 兜底，切稳后可删
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import json, os, sys, time, datetime
          import urllib.request, urllib.error

          print("=== AI Weekly Digest Generator ===")

          LLM_API_KEY = os.environ.get("LLM_API_KEY") or os.environ.get("OPENROUTER_API_KEY", "")
          LLM_BASE_URL = (os.environ.get("LLM_BASE_URL") or "https://api.deepseek.com").rstrip("/")
          MODEL = os.environ.get("LLM_MODEL") or os.environ.get("OPENROUTER_MODEL") or "deepseek-v4-flash"
          GITHUB_API_TOKEN  = os.environ.get("GITHUB_API_TOKEN", "")

          if not LLM_API_KEY:
              print("ERROR: LLM_API_KEY (or OPENROUTER_API_KEY) secret is not configured")
              sys.exit(1)

          # ─── 1. Fetch HackerNews top stories ─────────────────────────
          print("\n[1/3] Fetching HackerNews top stories...")
          try:
              with urllib.request.urlopen(
                  "https://hacker-news.firebaseio.com/v0/topstories.json",
                  timeout=15,
              ) as resp:
                  top_ids = json.loads(resp.read())[:20]
          except Exception as exc:
              print(f"  WARN: Could not fetch HN top stories: {exc}")
              top_ids = []

          hn_items = []
          for sid in top_ids:
              try:
                  with urllib.request.urlopen(
                      f"https://hacker-news.firebaseio.com/v0/item/{sid}.json",
                      timeout=10,
                  ) as resp:
                      item = json.loads(resp.read())
                  if item and item.get("type") == "story" and item.get("title"):
                      hn_items.append({
                          "title": item["title"],
                          "url": item.get("url") or f"https://news.ycombinator.com/item?id={sid}",
                          "score": item.get("score", 0),
                          "source": "HN",
                      })
                  time.sleep(0.05)
              except Exception as exc:
                  print(f"  WARN: HN item {sid}: {exc}")

          print(f"  Fetched {len(hn_items)} HN stories")

          # ─── 2. Fetch GitHub trending repos ───────────────────────────
          print("\n[2/3] Fetching GitHub trending repos...")
          gh_url = (
              "https://api.github.com/search/repositories"
              "?q=stars:>100+pushed:>2025-01-01&sort=stars&order=desc&per_page=20"
          )
          gh_req = urllib.request.Request(gh_url)
          gh_req.add_header("Accept", "application/vnd.github.v3+json")
          gh_req.add_header("User-Agent", "ai-weekly-digest/1.0")
          if GITHUB_API_TOKEN:
              gh_req.add_header("Authorization", f"Bearer {GITHUB_API_TOKEN}")

          github_items = []
          try:
              with urllib.request.urlopen(gh_req, timeout=15) as resp:
                  gh_data = json.loads(resp.read())
              for repo in gh_data.get("items", [])[:15]:
                  github_items.append({
                      "title": repo["full_name"],
                      "url": repo["html_url"],
                      "score": repo.get("stargazers_count", 0),
                      "description": (repo.get("description") or "")[:200],
                      "language": repo.get("language") or "",
                      "source": "GitHub",
                  })
          except Exception as exc:
              print(f"  WARN: GitHub API error: {exc}")

          print(f"  Fetched {len(github_items)} GitHub repos")

          # ─── 3. Build Claude prompt ────────────────────────────────────
          lines = []
          for it in hn_items:
              lines.append(f"[HN] score={it['score']} | {it['title']} | {it['url']}")
          for it in github_items:
              lang = f"[{it['language']}] " if it["language"] else ""
              desc = f" -- {it['description']}" if it["description"] else ""
              lines.append(f"[GitHub] stars={it['score']} | {lang}{it['title']}{desc} | {it['url']}")

          content_block = "\n".join(lines)

          prompt = (
              "你是一位资深技术编辑，专注于 AI、开源软件和开发者工具领域。\n\n"
              "请从以下技术资讯列表中，精选出最值得关注的 10 条，并为每条撰写 60-100 字的中文摘要。\n"
              "摘要重点：核心价值、为何值得关注、对开发者的实际影响。\n\n"
              "资讯列表：\n"
              f"{content_block}\n\n"
              "以 JSON 数组返回，每项字段：\n"
              '- title: 英文原标题（字符串）\n'
              '- url: 原始链接（字符串）\n'
              '- source: "HN" 或 "GitHub"（字符串）\n'
              '- summary: 中文摘要，60-100字（字符串）\n'
              '- score: 原始评分或星标数（整数）\n\n'
              "只返回 JSON 数组，不要 markdown 代码块标记，不要任何其他文字。"
          )

          # ─── 4. Call Anthropic Claude API ─────────────────────────────
          print(f"\n[3/3] Calling OpenRouter ({MODEL})...")
          payload = json.dumps({
              "model": MODEL,
              "max_tokens": 8192,
              "messages": [{"role": "user", "content": prompt}],
          }).encode("utf-8")

          api_req = urllib.request.Request(
              LLM_BASE_URL + "/chat/completions",
              data=payload,
              method="POST",
          )
          api_req.add_header("Authorization", f"Bearer {LLM_API_KEY}")
          api_req.add_header("Content-Type", "application/json")

          try:
              with urllib.request.urlopen(api_req, timeout=90) as resp:
                  api_result = json.loads(resp.read())
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              print(f"  ERROR: OpenRouter HTTP {exc.code}: {body[:500]}")
              sys.exit(1)
          except Exception as exc:
              print(f"  ERROR: OpenRouter: {exc}")
              sys.exit(1)

          raw = api_result["choices"][0]["message"]["content"].strip()

          # 稳健提取 JSON 数组：不同模型可能包 markdown 围栏或加前言，
          # 统一抓取第一个 [ 到最后一个 ] 之间的内容。
          import re as _re
          _m = _re.search(r"```(?:json)?\s*(.+?)```", raw, _re.S)
          if _m:
              raw = _m.group(1).strip()
          _i, _j = raw.find("["), raw.rfind("]")
          if _i != -1 and _j != -1 and _j > _i:
              raw = raw[_i:_j+1]
          raw = raw.strip()

          try:
              digest_items = json.loads(raw)
          except json.JSONDecodeError as exc:
              print(f"  ERROR: Could not parse model response as JSON: {exc}")
              print(f"  RAW length={len(raw)}, finish_reason={api_result.get('choices',[{}])[0].get('finish_reason')}")
              print(f"  RAW tail: ...{raw[-200:]}")
              print(f"  Raw preview: {raw[:400]}")
              sys.exit(1)

          print(f"  Claude returned {len(digest_items)} items")

          # ─── 5. Write _data/latest.json ───────────────────────────────
          now = datetime.datetime.utcnow()
          week_num = int(now.strftime("%W"))
          output = {
              "generated_at": now.isoformat() + "Z",
              "week": f"{now.year} 第 {week_num} 周",
              "year": now.year,
              "week_number": week_num,
              "items": digest_items,
          }

          os.makedirs("_data", exist_ok=True)
          with open("_data/latest.json", "w", encoding="utf-8") as fh:
              json.dump(output, fh, ensure_ascii=False, indent=2)

          print(f"\n[DONE] Digest saved to _data/latest.json")
          print(f"  Week : {output['week']}")
          print(f"  Items: {len(digest_items)}")
          PYEOF

      - name: Commit and push digest
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add _data/latest.json
          if git diff --staged --quiet; then
            echo "Nothing changed — skipping commit."
          else
            git commit -m "chore: weekly digest $(date -u '+%Y-%m-%d')"
            # --- 改造：bot 不再直推 main，改为开 PR 并自动合并 ---
            git fetch origin main --depth=1 -q
            if [ -z "$(git log FETCH_HEAD..HEAD --oneline)" ]; then
              echo "No new commits; nothing to do."
              exit 0
            fi
            BRANCH="bot/$(date -u +%Y%m%d-%H%M%S)"
            git push -u origin "HEAD:$BRANCH"
            export GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            gh pr create --base main --head "$BRANCH" \
              --title "$(git log -1 --pretty=%s)" \
              --body "Automated update by workflow: ${{ github.workflow }}"
            gh pr merge "$BRANCH" --squash --delete-branch
          fi
      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="⚠️ 工作流 ${{ github.workflow }} 运行失败"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="[${{ github.workflow }}]($RUN_URL) 于 $(date -u '+%Y-%m-%d %H:%M UTC') 失败（分支 ${{ github.ref_name }}，触发 ${{ github.event_name }}）。请查看日志。"
          EXISTING=$(gh issue list --state open --search "in:title $TITLE" --json number,title --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh label create ci-failure --color d73a4a --description "自动化工作流失败告警" 2>/dev/null || true
            gh issue create --title "$TITLE" --body "$BODY" --label ci-failure 2>/dev/null || gh issue create --title "$TITLE" --body "$BODY"
          fi
